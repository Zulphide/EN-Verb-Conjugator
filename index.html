<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Verb Conjugator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00C17E 0%, #FFC52B 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 700;
        }

        .tense-indicator {
            color: #006853;
            font-size: 1.2em;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .menu-section {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            text-align: left;
        }

        input[type="url"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="url"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #00C17E;
        }

        .btn {
            background: linear-gradient(45deg, #00C17E, #FFC52B);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f44336;
        }

        .btn-back {
            background: #ff9800;
            margin-bottom: 20px;
        }

        .quiz-container {
            display: none;
        }

        .question-counter {
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .question {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #333;
        }

        .pronoun {
            color: #006853;
            font-weight: bold;
        }

        .verb-base {
            color: #981426;
            font-weight: bold;
        }

        .answer-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .results-container {
            display: none;
        }

        .score {
            font-size: 2em;
            margin-bottom: 20px;
            color: #333;
        }

        .score.excellent {
            color: #28a745;
        }

        .score.good {
            color: #ffc107;
        }

        .score.needs-improvement {
            color: #dc3545;
        }

        .loading {
            color: #006853;
            font-style: italic;
        }

        .error {
            color: #f44336;
            background: #ffebee;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .quit-warning {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #ffeaa7;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff3cd;
            color: #856404;
            padding: 30px 30px 20px 30px;
            border-radius: 12px;
            border: 1px solid #ffeaa7;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
            min-width: 280px;
        }

        /* thin progress bar (fits current color scheme) */
        .progress-bar {
            height: 8px;
            background: #eef9f2;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00C17E 0%, #FFC52B 100%);
            transition: width 300ms ease;
        }

        .recent-scores,
        .missed-verbs {
            text-align: left;
            margin-top: 18px;
        }

        .score-list,
        .missed-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
        }

        .score-item,
        .missed-item {
            background: #f7f7f7;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 0.95em;
            color: #333;
        }

        .score-item strong,
        .missed-item strong {
            color: #006853;
        }

        .score-item small,
        .missed-item small {
            color: #666;
        }

        .results-summary {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin: 22px 0 18px;
        }

        .summary-card {
            background: #f9f9f9;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
        }

        .summary-card .label {
            display: block;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #666;
            margin-bottom: 8px;
        }

        .summary-card .value {
            font-size: 1.5em;
            font-weight: 700;
            color: #006853;
        }

        .summary-card .value.warning {
            color: #b86200;
        }

        .summary-card .value.danger {
            color: #b3261e;
        }

        .cursor-glow,
        .click-ripple {
            position: fixed;
            pointer-events: none;
            z-index: 2000;
            border-radius: 50%;
            opacity: 0;
        }

        .cursor-glow {
            width: 34px;
            height: 34px;
            background: radial-gradient(circle, rgba(255, 197, 43, 0.28) 0%, rgba(0, 193, 126, 0) 72%);
            transform: translate(-50%, -50%);
            transition: opacity 180ms ease;
        }

        .click-ripple {
            width: 12px;
            height: 12px;
            border: 2px solid #ffc52b;
            transform: translate(-50%, -50%);
            animation: click-ripple 500ms ease-out forwards;
        }

        body.custom-cursor-active .cursor-glow {
            opacity: 1;
        }

        @keyframes click-ripple {
            from {
                opacity: 0.7;
                transform: translate(-50%, -50%) scale(1);
            }
            to {
                opacity: 0;
                transform: translate(-50%, -50%) scale(3.2);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .btn {
                padding: 12px 25px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="appHeader">
            <h1 id="appTitle" style="color: #006853;">English Verb Conjugator</h1>
            <h2 id="emojiHeading" title="v1.3 updates: first-attempt accuracy, clearer error reasons, class verb counts, and subtle cursor feedback."></h2>
        </div>
 
         <!-- Main Menu -->
        <div id="mainMenu" class="menu-section">
            <div class="input-group">
                <label for="sheetSelect">Choose Your Class: <span id="classVerbCount"></span></label>
                <select id="sheetSelect" onchange="onSheetSelectChange()">
                    <option value="https://docs.google.com/spreadsheets/d/e/2PACX-1vSV9ECEeuvSF5IOJkK_KkIOZr1uXZWooiRvoWO13XcecekYCKynaqSNJIbqU10-rMMAYH14b4HyVaBD/pub?gid=0&single=true&output=csv" selected>905</option>
                    <option value="https://docs.google.com/spreadsheets/d/e/2PACX-1vSV9ECEeuvSF5IOJkK_KkIOZr1uXZWooiRvoWO13XcecekYCKynaqSNJIbqU10-rMMAYH14b4HyVaBD/pub?gid=370366080&single=true&output=csv">906</option>
                    <option value="custom">Custom URL...</option>
                </select>
             </div>
        <div class="input-group" id="sheetUrlGroup" style="display:none;">
            <label for="sheetUrl">Google Sheets URL:</label>
            <input type="url" id="sheetUrl" placeholder="paste your published CSV URL here...">
        </div>
            
            <div class="input-group">
                <label for="tenseSelect">Choose a Tense:</label>
                <select id="tenseSelect">
                    <option value="present">Present Tense</option>
                    <option value="past">Past Tense</option>
                    <option value="future">Future Tense</option>
                    <option value="present_continuous">Present Progressive</option>
                    <option value="past_continuous">Past Progressive</option>
                    <option value="present_perfect">Present Perfect</option>
                    <option value="past_perfect">Past Perfect</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="questionCount">Number of Questions:</label>
                <input type="number" id="questionCount" min="1" max="50" value="20">
            </div>

            <div id="recentScores" class="recent-scores" aria-live="polite"></div>
            
            <button class="btn" onclick="startQuiz()">Start Quiz</button>
            <div id="loadingMessage" class="loading" style="display: none;">Loading verbs...</div>
            <div id="errorMessage" class="error" style="display: none;"></div>
        </div>

        <!-- Quiz Section -->
        <div id="quizSection" class="quiz-container">
            <div class="tense-indicator" id="currentTense"></div>
                        
             <div id="quitWarning" class="quit-warning" style="display: none;">
                 <p>Are you sure? Current progress will be lost.</p>
                 <button class="btn btn-secondary" onclick="quitQuiz()">Yes, Quit</button>
                 <button class="btn" onclick="hideQuitWarning()">Continue Quiz</button>
             </div>
            
            <div class="question-counter" id="questionCounter"></div>
            <!-- thin progress bar showing current progress (moved below question counter) -->
            <div class="progress-bar" aria-hidden="true">
                <div id="progressFill" class="progress-fill" style="width:0%"></div>
            </div>
             <div class="question" id="question"></div>
             <input type="text" id="answerInput" class="answer-input" placeholder="Write the full sentence.">
             <button class="btn" id="submitBtn" onclick="checkAnswer()">Submit Answer</button>
             <button class="btn" onclick="nextQuestion()" id="nextBtn" style="display: none;">Next Question</button>
             <div id="feedback" class="feedback" style="display: none;"></div>
 
             <button class="btn btn-back" onclick="showQuitWarning()">← Back to Main Menu</button>
         </div>       

            <!-- Modal Overlay for Quit Warning -->
        <div id="quitWarningOverlay" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <p>Are you sure? Current progress will be lost.</p>
                <button class="btn btn-secondary" onclick="quitQuiz()">Yes, Quit</button>
                <button class="btn" onclick="hideQuitWarning()">Continue Quiz</button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="results-container">
            <div class="tense-indicator" id="resultsTense"></div>
            <h2>Quiz Complete!</h2>
            <div class="score" id="finalScore"></div>
            <div id="resultsSummary" class="results-summary" aria-live="polite"></div>
            <div id="scoreMessage"></div>
            <div id="missedVerbsContainer" class="missed-verbs" style="display: none;"></div>
            <button class="btn" onclick="backToMenu()">Back to Main Menu</button>
        </div>
    </div>

    <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
    <script>
        let verbs = [];
        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let currentTense = 'present';
        let totalQuestions = 10;
        let currentAnswer = '';
        let currentQuestionMissed = false;
        let loadedSheetUrl = '';
        let missedQuestions = [];
        const RECENT_SCORES_KEY = 'enVerbConjugatorRecentScores';

        const pronouns = {
            present: ['I', 'You', 'He', 'She', 'It', 'We', 'They'],
            past: ['I', 'You', 'He', 'She', 'It', 'We', 'They'],
            future: ['I', 'You', 'He', 'She', 'It', 'We', 'They'],
            present_continuous: ['I', 'You', 'He', 'She', 'It', 'We', 'They'],
            past_continuous: ['I', 'You', 'He', 'She', 'It', 'We', 'They'],
            present_perfect: ['I', 'You', 'He', 'She', 'It', 'We', 'They'],
            past_perfect: ['I', 'You', 'He', 'She', 'It', 'We', 'They']
        };

        const tenseNames = {
            present: 'Present Tense',
            past: 'Past Tense',
            future: 'Future Tense',
            present_continuous: 'Present Progressive',
            past_continuous: 'Past Progressive',
            present_perfect: 'Present Perfect',
            past_perfect: 'Past Perfect'
        };

        const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSV9ECEeuvSF5IOJkK_KkIOZr1uXZWooiRvoWO13XcecekYCKynaqSNJIbqU10-rMMAYH14b4HyVaBD/pub?gid=0&single=true&output=csv";

        function normalizeHeader(value) {
            return String(value || '')
                .trim()
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .trim();
        }

        function parseCsvText(csvText) {
            if (!csvText) return [];

            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let inQuotes = false;

            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                const nextChar = csvText[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentCell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentCell);
                    currentCell = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') {
                        i++;
                    }
                    currentRow.push(currentCell);
                    if (currentRow.some(cell => String(cell).trim() !== '')) {
                        rows.push(currentRow);
                    }
                    currentRow = [];
                    currentCell = '';
                } else {
                    currentCell += char;
                }
            }

            if (currentCell.length > 0 || currentRow.length > 0) {
                currentRow.push(currentCell);
                if (currentRow.some(cell => String(cell).trim() !== '')) {
                    rows.push(currentRow);
                }
            }

            return rows;
        }

        function getVerbValue(verbObj, candidates) {
            const normalized = {};
            Object.keys(verbObj).forEach(key => {
                normalized[normalizeHeader(key)] = verbObj[key];
            });

            for (const candidate of candidates) {
                const loweredCandidate = normalizeHeader(candidate);
                if (normalized[loweredCandidate] !== undefined) {
                    return normalized[loweredCandidate];
                }
            }
            return '';
        }

        async function onSheetSelectChange() {
            const sheetSelect = document.getElementById('sheetSelect');
            const sheetUrlInput = document.getElementById('sheetUrl');
            const sheetUrlGroup = document.getElementById('sheetUrlGroup');
            document.getElementById('classVerbCount').textContent = '';
            const val = sheetSelect.value;
            if (val === 'custom') {
                sheetUrlInput.value = '';
                sheetUrlInput.disabled = false;
                sheetUrlGroup.style.display = '';
                return;
            } else {
                sheetUrlInput.value = val || DEFAULT_SHEET_URL;
                sheetUrlInput.disabled = true;
                sheetUrlGroup.style.display = 'none';
            }

            await loadVerbs();
        }

        function updateSelectedClassLabel(verbCount) {
            const sheetSelect = document.getElementById('sheetSelect');
            const selectedOption = sheetSelect.options[sheetSelect.selectedIndex];
            if (!selectedOption || selectedOption.value === 'custom') return;

            const baseLabel = selectedOption.dataset.baseLabel || selectedOption.textContent.replace(/\s+\(\d+ verbs?\)$/, '');
            selectedOption.dataset.baseLabel = baseLabel;
            selectedOption.textContent = `${baseLabel} (${verbCount} verb${verbCount === 1 ? '' : 's'})`;
            document.getElementById('classVerbCount').textContent = `(${verbCount} verb${verbCount === 1 ? '' : 's'})`;
        }


        function conjugateVerb(verb, pronoun, tense) {
            // normalize base (remove leading "to " if present) and common forms
            const rawBase = verb.base || verb.infinitive || verb.present || '';
            const base = String(rawBase).trim().replace(/^to\s+/i, ''); // <-- strip leading "to "
            const baseLower = base.toLowerCase();

            const past = verb.past || verb['past simple'] || verb.past_simple || '';
            const pastParticiple = verb['past participle'] || verb.pp || verb.past_participle || '';
            const presentParticiple = verb['present participle'] || verb.ing || verb.present_participle || (base + 'ing');

            // helper for sheet-provided variants (headers were lowercased when parsed)
            const presentThird = verb['present third'] || verb.present_third || verb['presentthird'] || verb.he_she_it || '';

            // Special handling for "be" verb (works even if sheet had "to be")
            if (baseLower === 'be') {
                switch (tense) {
                    case 'present':
                        if (pronoun === 'I') return 'am';
                        if (pronoun === 'He' || pronoun === 'She' || pronoun === 'It') return 'is';
                        return 'are';
                    case 'past':
                        if (pronoun === 'I' || pronoun === 'He' || pronoun === 'She' || pronoun === 'It') return 'was';
                        return 'were';
                    case 'future':
                        return 'will be';
                    case 'present_continuous':
                        const bePresent = (pronoun === 'I') ? 'am' :
                                          (pronoun === 'He' || pronoun === 'She' || pronoun === 'It') ? 'is' : 'are';
                        return bePresent + ' ' + presentParticiple;
                    case 'past_continuous':
                        const bePast = (pronoun === 'I' || pronoun === 'He' || pronoun === 'She' || pronoun === 'It') ? 'was' : 'were';
                        return bePast + ' ' + presentParticiple;
                    case 'present_perfect':
                        const havePresent = (pronoun === 'He' || pronoun === 'She' || pronoun === 'It') ? 'has' : 'have';
                        return havePresent + ' been';
                    case 'past_perfect':
                        return 'had been';
                    default:
                        return base;
                }
            }

            // Handle other irregular verbs / tenses
            switch (tense) {
                case 'present':
                    if (pronoun === 'He' || pronoun === 'She' || pronoun === 'It') {
                        return presentThird || thirdPersonForm(base);
                    }
                    return base;
                case 'past':
                    return past || (base + 'ed');
                case 'future':
                    return 'will ' + base;
                case 'present_continuous':
                    const beP = (pronoun === 'I') ? 'am' :
                                (pronoun === 'He' || pronoun === 'She' || pronoun === 'It') ? 'is' : 'are';
                    return beP + ' ' + presentParticiple;
                case 'past_continuous':
                    const bePa = (pronoun === 'I' || pronoun === 'He' || pronoun === 'She' || pronoun === 'It') ? 'was' : 'were';
                    return bePa + ' ' + presentParticiple;
                case 'present_perfect':
                    const haveP = (pronoun === 'He' || pronoun === 'She' || pronoun === 'It') ? 'has' : 'have';
                    return haveP + ' ' + (pastParticiple || past || (base + 'ed'));
                case 'past_perfect':
                    return 'had ' + (pastParticiple || past || (base + 'ed'));
                default:
                    return base;
            }

            // small helper for generating 3rd person when sheet doesn't provide it
            function thirdPersonForm(b) {
                if (!b) return '';
                const lower = b.toLowerCase();
                if (/[sxz]$/.test(lower) || /(sh|ch)$/.test(lower)) return b + 'es';
                if (/[aeiou]y$/.test(lower)) return b + 's';
                if (/y$/.test(lower)) return b.slice(0, -1) + 'ies';
                return b + 's';
            }
        }

        async function loadVerbs() {
            const url = document.getElementById('sheetUrl').value.trim();
            if (!url) {
                showError('Please enter a Google Sheets URL');
                return false;
            }

            try {
                document.getElementById('loadingMessage').style.display = 'block';
                document.getElementById('errorMessage').style.display = 'none';

                let csvUrl = url;
                if (url.includes('/edit')) {
                    csvUrl = url.replace('/edit#gid=', '/export?format=csv&gid=');
                    csvUrl = url.includes('/edit#') ? url.replace('/edit#gid=', '/export?format=csv&gid=') : url.replace('/edit', '/export?format=csv');
                }

                const response = await fetch(csvUrl);
                if (!response.ok) {
                    throw new Error('Failed to fetch data from Google Sheets');
                }

                const csvText = await response.text();
                const rows = parseCsvText(csvText);
                if (rows.length < 2) {
                    throw new Error('Sheet must have at least a header row and one data row');
                }

                const headers = rows[0].map(header => String(header).trim());
                verbs = [];

                for (let i = 1; i < rows.length; i++) {
                    const values = rows[i];
                    const verbObj = {};

                    headers.forEach((header, index) => {
                        const rawValue = values[index] || '';
                        const cleanedValue = String(rawValue).trim();
                        if (cleanedValue) {
                            verbObj[header] = cleanedValue;
                        }
                    });

                    const baseValue = getVerbValue(verbObj, ['base', 'infinitive', 'present', 'verb', 'word', 'english verb']);
                    const normalizedBase = String(baseValue || '').trim();

                    if (normalizedBase) {
                        const canonicalVerb = { ...verbObj };
                        canonicalVerb.base = canonicalVerb.base || normalizedBase;
                        canonicalVerb.infinitive = canonicalVerb.infinitive || normalizedBase;
                        canonicalVerb.present = canonicalVerb.present || normalizedBase;
                        canonicalVerb.verb = canonicalVerb.verb || normalizedBase;
                        verbs.push(canonicalVerb);
                    }
                }

                if (verbs.length === 0) {
                    throw new Error('No valid verbs found in the sheet');
                }

                loadedSheetUrl = url;
                updateSelectedClassLabel(verbs.length);
                document.getElementById('loadingMessage').style.display = 'none';
                return true;

            } catch (error) {
                document.getElementById('loadingMessage').style.display = 'none';
                showError('Error loading verbs: ' + error.message);
                return false;
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function loadRecentScores() {
            try {
                const raw = localStorage.getItem(RECENT_SCORES_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (error) {
                return [];
            }
        }

        function saveRecentScore(entry) {
            try {
                const recentScores = loadRecentScores();
                recentScores.unshift(entry);
                const trimmedScores = recentScores.slice(0, 5);
                localStorage.setItem(RECENT_SCORES_KEY, JSON.stringify(trimmedScores));
            } catch (error) {
                // Ignore storage failures so the app keeps working when browser storage is unavailable.
            }
            renderRecentScores();
        }

        function renderRecentScores() {
            const container = document.getElementById('recentScores');
            if (!container) return;

            const recentScores = loadRecentScores();
            if (!recentScores.length) {
                container.innerHTML = '<div class="score-item"><strong>Recent scores</strong><br><small>No recent scores yet.</small></div>';
                return;
            }

            const html = recentScores.map((scoreEntry) => {
                const dateLabel = new Date(scoreEntry.timestamp).toLocaleDateString([], {
                    month: 'short',
                    day: 'numeric'
                });
                return `
                    <div class="score-item">
                        <strong>${escapeHtml(scoreEntry.score)} / ${escapeHtml(scoreEntry.total)}</strong>
                        <br>
                        <small>${escapeHtml(scoreEntry.tenseLabel)} • ${escapeHtml(dateLabel)}</small>
                    </div>
                `;
            }).join('');

            container.innerHTML = `<strong>Recent scores</strong>${html}`;
        }

        function renderResultsSummary() {
            const container = document.getElementById('resultsSummary');
            if (!container) return;

            const correctAnswers = score;
            const missedCount = missedQuestions.length;
            const accuracy = totalQuestions ? Math.round((correctAnswers / totalQuestions) * 100) : 0;
            const reasonCounts = missedQuestions.reduce((counts, item) => {
                counts[item.reason] = (counts[item.reason] || 0) + 1;
                return counts;
            }, {});
            const reviewFocus = Object.entries(reasonCounts)
                .map(([reason, count]) => `${reason} (${count})`)
                .join(', ');

            const cards = [
                { label: 'Correct', value: `${correctAnswers}/${totalQuestions}`, className: 'value' },
                { label: 'Accuracy', value: `${accuracy}%`, className: accuracy >= 70 ? 'value' : accuracy >= 40 ? 'value warning' : 'value danger' },
                { label: 'Missed', value: String(missedCount), className: missedCount === 0 ? 'value' : 'value warning' },
                { label: 'Review focus', value: missedCount === 0 ? 'Great job' : reviewFocus, className: missedCount === 0 ? 'value' : 'value danger' }
            ];

            container.innerHTML = cards.map((card) => `
                <div class="summary-card">
                    <span class="label">${card.label}</span>
                    <span class="${card.className}">${card.value}</span>
                </div>
            `).join('');
        }

        function renderMissedQuestions() {
            const container = document.getElementById('missedVerbsContainer');
            if (!container) return;

            if (!missedQuestions.length) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            const listHtml = missedQuestions.map((item) => {
                const infinitive = item.verbBase || 'verb';
                const infoUrl = `https://conjugator.reverso.net/conjugation-english-verb-${encodeURIComponent(infinitive.toLowerCase())}.html`;
                return `
                    <li class="missed-item">
                        <strong>${escapeHtml(item.pronoun)} ${escapeHtml(item.answer)}.</strong>
                        <div><small><a href="${infoUrl}" target="_blank" rel="noopener noreferrer">Review this verb</a></small></div>
                    </li>
                `;
            }).join('');

            container.innerHTML = `<strong>Missed verbs</strong><ul class="missed-list">${listHtml}</ul>`;
            container.style.display = 'block';
        }

        async function startQuiz() {
            const selectedSheetUrl = document.getElementById('sheetUrl').value.trim();
            if (verbs.length === 0 || loadedSheetUrl !== selectedSheetUrl) {
                const loaded = await loadVerbs();
                if (!loaded) return;
            }

            currentTense = document.getElementById('tenseSelect').value;
            totalQuestions = parseInt(document.getElementById('questionCount').value) || 10;
            missedQuestions = [];

            currentQuiz = [];
            const uniqueVerbIndexes = new Set();
            for (let i = 0; i < totalQuestions; i++) {
                let randomIndex = Math.floor(Math.random() * verbs.length);
                while (uniqueVerbIndexes.size < verbs.length && uniqueVerbIndexes.has(randomIndex) && currentQuiz.length < totalQuestions) {
                    randomIndex = Math.floor(Math.random() * verbs.length);
                }
                if (currentQuiz.length < totalQuestions) {
                    uniqueVerbIndexes.add(randomIndex);
                }
                const randomVerb = verbs[randomIndex];
                const randomPronoun = pronouns[currentTense][Math.floor(Math.random() * pronouns[currentTense].length)];
                currentQuiz.push({
                    verb: randomVerb,
                    pronoun: randomPronoun,
                    answer: conjugateVerb(randomVerb, randomPronoun, currentTense)
                });
            }

            currentQuestionIndex = 0;
            score = 0;

            document.getElementById('appHeader').style.display = 'none';

            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('quizSection').style.display = 'block';
            document.getElementById('currentTense').textContent = 'Current Tense: ' + tenseNames[currentTense];

            const pf = document.getElementById('progressFill');
            if (pf) pf.style.width = '0%';

            showQuestion();
        }

        function showQuestion() {
            document.getElementById('answerInput').disabled = false;
            const question = currentQuiz[currentQuestionIndex];
            const verbBase = question.verb.base || question.verb.infinitive || question.verb.present || '';

            document.getElementById('questionCounter').textContent = `Question ${currentQuestionIndex + 1} of ${totalQuestions}`;
            document.getElementById('question').innerHTML = `<span class="pronoun">${question.pronoun}</span> <span class="verb-base">(${verbBase})</span>`;
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').focus();
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submit Answer';
            currentAnswer = question.answer;
            currentQuestionMissed = false;

            // update progress bar: completed questions proportion
            const pf = document.getElementById('progressFill');
            if (pf && totalQuestions > 0) {
                const percent = Math.round((currentQuestionIndex / totalQuestions) * 100);
                pf.style.width = percent + '%';
            }
        }

        function normalizeSentence(sentence) {
            return sentence.trim().replace(/\s+/g, ' ');
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function getExpectedFullSentence(question) {
            return `${question.pronoun} ${question.answer}.`;
        }

        function isFullSentenceAnswer(answer, expected) {
            const trimmed = answer.trim();
            return /^[A-Z]/.test(trimmed) && trimmed.endsWith('.') && normalizeSentence(trimmed) === normalizeSentence(expected);
        }

        function isConjugationCorrect(answer, question) {
            const normalized = normalizeSentence(answer.toLowerCase()).replace(/\.$/, '');
            const expectedPhrase = question.answer.toLowerCase();
            const phraseRegex = new RegExp(`\\b${escapeRegExp(expectedPhrase)}\\b`, 'i');
            return phraseRegex.test(normalized);
        }

        function getSentenceFormatReason(answer, question, expected) {
            const answerWithoutPunctuation = normalizeSentence(answer).replace(/[.!?]+$/, '');
            const expectedWithoutPunctuation = normalizeSentence(expected).replace(/[.!?]+$/, '');
            const answerSubject = answerWithoutPunctuation.split(' ')[0] || '';
            const reasons = [];

            if (!answer.trim().endsWith('.')) {
                reasons.push('Missing punctuation');
            }
            if (answerSubject.toLowerCase() !== question.pronoun.toLowerCase()) {
                reasons.push('Misspelled subject');
            } else if (answerWithoutPunctuation !== expectedWithoutPunctuation) {
                reasons.push('Mis-capitalization');
            }

            return reasons.join(' and ') || 'Missing punctuation';
        }

        function checkAnswer() {
            const rawAnswer = document.getElementById('answerInput').value;
            const trimmedAnswer = rawAnswer.trim();
            const question = currentQuiz[currentQuestionIndex];
            const expectedFullAnswer = getExpectedFullSentence(question);

            const feedback = document.getElementById('feedback');
            let feedbackMsg = '';
            let isCorrect = false;
            let incorrectReason = '';

            if (isFullSentenceAnswer(trimmedAnswer, expectedFullAnswer)) {
                if (!currentQuestionMissed) {
                    score++;
                }
                isCorrect = true;
                feedbackMsg = currentQuestionMissed
                    ? '✅ Corrected, but this question remains missed.'
                    : '✅ Want to learn more?';
                feedback.className = 'feedback correct';
                document.getElementById('answerInput').disabled = true;
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('nextBtn').style.display = 'inline-block';
            } else if (isConjugationCorrect(trimmedAnswer, question)) {
                const reason = getSentenceFormatReason(trimmedAnswer, question, expectedFullAnswer);
                incorrectReason = reason;
                feedbackMsg = `<span title="${reason}">${reason}</span>: ${expectedFullAnswer}`;
                feedback.className = 'feedback incorrect';
                const answerInput = document.getElementById('answerInput');
                answerInput.disabled = false;
                answerInput.focus();
                answerInput.select();
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Resubmit';
                document.getElementById('nextBtn').style.display = 'none';
            } else {
                incorrectReason = 'Incorrect conjugation';
                feedbackMsg = `<span title="Incorrect conjugation">Incorrect conjugation</span>: ${expectedFullAnswer}`;
                feedback.className = 'feedback incorrect';
                const answerInput = document.getElementById('answerInput');
                answerInput.disabled = false;
                answerInput.focus();
                answerInput.select();
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Resubmit';
                document.getElementById('nextBtn').style.display = 'none';
            }

            if (!isCorrect) {
                currentQuestionMissed = true;
                const missedEntry = {
                    pronoun: question.pronoun,
                    verbBase: question.verb.base || question.verb.infinitive || question.verb.present || '',
                    answer: question.answer,
                    tense: currentTense,
                    reason: incorrectReason
                };

                const existingMiss = missedQuestions.find(item =>
                    item.pronoun === missedEntry.pronoun &&
                    item.verbBase === missedEntry.verbBase &&
                    item.answer === missedEntry.answer
                );

                if (!existingMiss) {
                    missedQuestions.push(missedEntry);
                }
            }

            const infinitive = question.verb.infinitive || question.verb.base || question.verb.present || '';
            const infoUrl = `https://conjugator.reverso.net/conjugation-english-verb-${encodeURIComponent(infinitive.toLowerCase())}.html`;
            feedback.innerHTML = `
                ${feedbackMsg}
                <button 
                    onclick="window.open('${infoUrl}', '_blank')" 
                    title="See more conjugations"
                    style="background:none;border:none;cursor:pointer;padding:0 0 0 8px;vertical-align:middle;">
                    <span style="font-size:1.5em; color:#006853;">&#9432;</span>
                </button>
            `;

            feedback.style.display = 'block';
            if (!isCorrect) {
                document.getElementById('answerInput').disabled = false;
            }
        }

        function nextQuestion() {
            document.getElementById('answerInput').disabled = false;
            currentQuestionIndex++;
            
            if (currentQuestionIndex < totalQuestions) {
                showQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('appHeader').style.display = 'none';

            document.getElementById('quizSection').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('resultsTense').textContent = 'Completed Tense: ' + tenseNames[currentTense];
            
            const percentage = Math.round((score / totalQuestions) * 100);
            const scoreDiv = document.getElementById('finalScore');
            scoreDiv.textContent = `${score} / ${totalQuestions} (${percentage}%)`;
            
            let message = '';
            if (percentage >= 90) {
                scoreDiv.className = 'score excellent';
                message = 'Excellent work! You have mastered this tense.';
            } else if (percentage >= 70) {
                scoreDiv.className = 'score good';
                message = 'Good job! Keep practicing to improve further.';
            } else {
                scoreDiv.className = 'score needs-improvement';
                message = 'Keep practicing! You\'ll get better with time.';
            }
            
            document.getElementById('scoreMessage').textContent = message;
            renderResultsSummary();
            renderMissedQuestions();

            saveRecentScore({
                score: score,
                total: totalQuestions,
                percentage: percentage,
                tenseLabel: tenseNames[currentTense],
                timestamp: Date.now()
            });

            const pf = document.getElementById('progressFill');
            if (pf) pf.style.width = '100%';
        }

        function showQuitWarning() {
            document.getElementById('quitWarningOverlay').style.display = 'flex';
        }

        function hideQuitWarning() {
            document.getElementById('quitWarningOverlay').style.display = 'none';
        }

        function quitQuiz() {
            hideQuitWarning();
            backToMenu();
        }

        function backToMenu() {
            document.getElementById('appHeader').style.display = 'block';

            document.getElementById('quizSection').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'block';
            document.getElementById('quitWarning').style.display = 'none';
            document.getElementById('missedVerbsContainer').style.display = 'none';
            
            currentQuiz = [];
            currentQuestionIndex = 0;
            score = 0;
            missedQuestions = [];
        }

        function initializeCursorEffects() {
            const supportsPointer = window.matchMedia('(pointer: fine)').matches;
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!supportsPointer || prefersReducedMotion) return;

            const glow = document.getElementById('cursorGlow');
            if (!glow) return;

            document.addEventListener('pointermove', function(event) {
                glow.style.opacity = '1';
                glow.style.left = `${event.clientX}px`;
                glow.style.top = `${event.clientY}px`;
            });

            document.addEventListener('pointerdown', function(event) {
                const ripple = document.createElement('span');
                ripple.className = 'click-ripple';
                ripple.style.left = `${event.clientX}px`;
                ripple.style.top = `${event.clientY}px`;
                document.body.appendChild(ripple);
                ripple.addEventListener('animationend', function() {
                    ripple.remove();
                }, { once: true });
            });

            document.addEventListener('pointerleave', function() {
                glow.style.opacity = '0';
            });

            document.addEventListener('pointerenter', function() {
                glow.style.opacity = '1';
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            onSheetSelectChange();
            renderRecentScores();
            initializeCursorEffects();
         });

        // Allow Enter key to submit answers
        document.getElementById('answerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !document.getElementById('answerInput').disabled) {
                checkAnswer();
            }
        });

        // Auto-focus on answer input when next question loads
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('answerInput').focus();
        });

        //random emoji for h2 heading
        document.addEventListener('DOMContentLoaded', function() {
            const emojis = ['📚', '📝', '🔤', '✏️', '🎲', '🧠', '💡', '🎓', '🤓', '🔎', '🦉', '📖', '🚀', '🌟', '💬'];
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            document.getElementById('emojiHeading').textContent = 'v1.3 ' + randomEmoji;
        });

        // Enable/disable submit button based on input
        document.addEventListener('DOMContentLoaded', function() {
            const answerInput = document.getElementById('answerInput');
            const submitBtn = document.getElementById('submitBtn');
            function toggleSubmitBtn() {
                submitBtn.disabled = answerInput.value.trim() === '';
            }
            answerInput.addEventListener('input', toggleSubmitBtn);
            toggleSubmitBtn(); // Set initial state
        });

    </script>
</body>
</html>
