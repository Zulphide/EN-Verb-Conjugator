<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Verb Conjugator</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00C17E 0%, #FFC52B 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #006853;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 700;
        }

        .tense-indicator {
            color: #006853;
            font-size: 1.2em;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .menu-section {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            text-align: left;
        }

        input[type="url"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="url"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #00C17E;
        }

        .btn {
            background: linear-gradient(45deg, #00C17E, #FFC52B);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:focus-visible {
            outline: 3px solid #006853;
            outline-offset: 2px;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f44336;
        }

        .btn-back {
            background: #ff9800;
            margin-bottom: 20px;
        }

        /* Subtle 5s auto-advance countdown, drawn along the bottom edge of the Next button */
        #nextBtn {
            position: relative;
            overflow: hidden;
        }

        .auto-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }

        .auto-fill {
            display: block;
            height: 100%;
            width: 100%;
            background: rgba(0, 104, 83, 0.65);
            transform: scaleX(0);
            transform-origin: left center;
        }

        .quiz-container {
            display: none;
        }

        .question-counter {
            color: #666;
            margin-bottom: 12px;
            font-size: 1.1em;
        }

        .question {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #333;
        }

        .pronoun {
            color: #006853;
            font-weight: bold;
        }

        .verb-base {
            color: #981426;
            font-weight: bold;
        }

        .answer-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
        }

        .answer-input:focus {
            outline: none;
            border-color: #00C17E;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .results-container {
            display: none;
        }

        .score {
            font-size: 2em;
            margin-bottom: 20px;
            color: #333;
        }

        .score.excellent { color: #28a745; }
        .score.good { color: #b8860b; }
        .score.needs-improvement { color: #dc3545; }

        .loading {
            color: #006853;
            font-style: italic;
        }

        .error {
            color: #f44336;
            background: #ffebee;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff3cd;
            color: #856404;
            padding: 30px 30px 20px 30px;
            border-radius: 12px;
            border: 1px solid #ffeaa7;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
            min-width: 280px;
        }

        .progress-bar {
            height: 8px;
            background: #eef9f2;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00C17E 0%, #FFC52B 100%);
            transition: width 300ms ease;
        }

        .recent-scores,
        .missed-verbs {
            text-align: left;
            margin-top: 18px;
        }

        .missed-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
        }

        .score-item,
        .missed-item {
            background: #f7f7f7;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 0.95em;
            color: #333;
        }

        .score-item strong,
        .missed-item strong {
            color: #006853;
        }

        .score-item small,
        .missed-item small {
            color: #666;
        }

        .results-summary {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin: 22px 0 18px;
        }

        .summary-card {
            background: #f9f9f9;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
        }

        .summary-card .label {
            display: block;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #666;
            margin-bottom: 8px;
            text-align: center;
        }

        .summary-card .value {
            font-size: 1.5em;
            font-weight: 700;
            color: #006853;
        }

        .summary-card .value.small {
            font-size: 1em;
        }

        .summary-card .value.warning { color: #b86200; }
        .summary-card .value.danger { color: #b3261e; }

        .cursor-glow,
        .click-ripple {
            position: fixed;
            pointer-events: none;
            z-index: 2000;
            border-radius: 50%;
            opacity: 0;
        }

        .cursor-glow {
            width: 34px;
            height: 34px;
            background: radial-gradient(circle, rgba(255, 197, 43, 0.28) 0%, rgba(0, 193, 126, 0) 72%);
            transform: translate(-50%, -50%);
            transition: opacity 180ms ease;
        }

        .click-ripple {
            width: 12px;
            height: 12px;
            border: 2px solid #ffc52b;
            transform: translate(-50%, -50%);
            animation: click-ripple 500ms ease-out forwards;
        }

        body.custom-cursor-active .cursor-glow {
            opacity: 1;
        }

        @keyframes click-ripple {
            from {
                opacity: 0.7;
                transform: translate(-50%, -50%) scale(1);
            }
            to {
                opacity: 0;
                transform: translate(-50%, -50%) scale(3.2);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .btn, .progress-fill { transition: none; }
            .click-ripple { animation: none; display: none; }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .btn {
                padding: 12px 25px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="appHeader">
            <h1 id="appTitle" title="v1.4: working submit/Enter key, accurate error reasons, phrasal-verb support, cleaner quiz selection.">English Verb Conjugator</h1>
        </div>

        <!-- Main Menu -->
        <div id="mainMenu" class="menu-section">
            <div class="input-group">
                <label for="sheetSelect">Choose Your Class: <span id="classVerbCount"></span></label>
                <select id="sheetSelect" onchange="onSheetSelectChange()">
                    <option value="https://docs.google.com/spreadsheets/d/e/2PACX-1vSV9ECEeuvSF5IOJkK_KkIOZr1uXZWooiRvoWO13XcecekYCKynaqSNJIbqU10-rMMAYH14b4HyVaBD/pub?gid=0&single=true&output=csv" selected>905</option>
                    <option value="https://docs.google.com/spreadsheets/d/e/2PACX-1vSV9ECEeuvSF5IOJkK_KkIOZr1uXZWooiRvoWO13XcecekYCKynaqSNJIbqU10-rMMAYH14b4HyVaBD/pub?gid=370366080&single=true&output=csv">907</option>
                    <option value="custom">Custom URL...</option>
                </select>
            </div>
            <div class="input-group" id="sheetUrlGroup" style="display:none;">
                <label for="sheetUrl">Google Sheets URL:</label>
                <input type="url" id="sheetUrl" placeholder="paste your published CSV URL here...">
            </div>

            <div class="input-group">
                <label for="tenseSelect">Choose a Tense:</label>
                <select id="tenseSelect">
                    <option value="present">Present Tense</option>
                    <option value="past">Past Tense</option>
                    <option value="future">Future Tense</option>
                    <option value="present_continuous">Present Progressive</option>
                    <option value="past_continuous">Past Progressive</option>
                    <option value="present_perfect">Present Perfect</option>
                    <option value="past_perfect">Past Perfect</option>
                </select>
            </div>

            <div class="input-group">
                <label for="questionCount">Number of Questions:</label>
                <input type="number" id="questionCount" min="1" max="50" value="20">
            </div>

            <div id="recentScores" class="recent-scores" aria-live="polite"></div>

            <button class="btn" id="startBtn" onclick="startQuiz()">Start Quiz</button>
            <div id="loadingMessage" class="loading" style="display: none;">Loading verbs...</div>
            <div id="errorMessage" class="error" style="display: none;" role="alert"></div>
        </div>

        <!-- Quiz Section -->
        <div id="quizSection" class="quiz-container">
            <div class="tense-indicator" id="currentTense"></div>

            <div class="question-counter" id="questionCounter"></div>
            <div class="progress-bar" aria-hidden="true">
                <div id="progressFill" class="progress-fill" style="width:0%"></div>
            </div>
            <div class="question" id="question"></div>
            <input type="text" id="answerInput" class="answer-input" placeholder="Write the full sentence."
                   autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                   aria-label="Your answer">
            <button class="btn" id="submitBtn" onclick="checkAnswer()" disabled>Submit Answer</button>
            <button class="btn" onclick="nextQuestion()" id="nextBtn" style="display: none;">
                <span id="nextLabel">Next Question</span>
                <span class="auto-bar" aria-hidden="true"><span class="auto-fill" id="autoFill"></span></span>
            </button>
            <div id="feedback" class="feedback" style="display: none;" aria-live="polite"></div>

            <button class="btn btn-back" onclick="showQuitWarning()">← Back to Main Menu</button>
        </div>

        <!-- Modal Overlay for Quit Warning -->
        <div id="quitWarningOverlay" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-label="Quit quiz?">
            <div class="modal-content">
                <p>Are you sure? Current progress will be lost.</p>
                <button class="btn btn-secondary" onclick="quitQuiz()">Yes, Quit</button>
                <button class="btn" id="continueBtn" onclick="hideQuitWarning()">Continue Quiz</button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="results-container">
            <div class="tense-indicator" id="resultsTense"></div>
            <h2>Quiz Complete!</h2>
            <div class="score" id="finalScore"></div>
            <div id="resultsSummary" class="results-summary" aria-live="polite"></div>
            <div id="scoreMessage"></div>
            <div id="missedVerbsContainer" class="missed-verbs" style="display: none;"></div>
            <button class="btn" onclick="backToMenu()">Back to Main Menu</button>
        </div>
    </div>

    <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
    <script>
        let verbs = [];
        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let currentTense = 'present';
        let totalQuestions = 10;
        let answered = false;
        let loadedSheetUrl = '';
        let loadToken = 0;
        let missedQuestions = [];

        const RECENT_SCORES_KEY = 'enVerbConjugatorRecentScores';
        const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSV9ECEeuvSF5IOJkK_KkIOZr1uXZWooiRvoWO13XcecekYCKynaqSNJIbqU10-rMMAYH14b4HyVaBD/pub?gid=0&single=true&output=csv";

        const PRONOUNS = ['I', 'You', 'He', 'She', 'It', 'We', 'They'];
        const THIRD_PERSON = ['He', 'She', 'It'];

        const tenseNames = {
            present: 'Present Tense',
            past: 'Past Tense',
            future: 'Future Tense',
            present_continuous: 'Present Progressive',
            past_continuous: 'Past Progressive',
            present_perfect: 'Present Perfect',
            past_perfect: 'Past Perfect'
        };

        /* ---------- CSV / sheet helpers ---------- */

        function normalizeHeader(value) {
            return String(value || '')
                .trim()
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .trim();
        }

        function parseCsvText(csvText) {
            if (!csvText) return [];

            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let inQuotes = false;

            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                const nextChar = csvText[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentCell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentCell);
                    currentCell = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    currentRow.push(currentCell);
                    if (currentRow.some(cell => String(cell).trim() !== '')) rows.push(currentRow);
                    currentRow = [];
                    currentCell = '';
                } else {
                    currentCell += char;
                }
            }

            if (currentCell.length > 0 || currentRow.length > 0) {
                currentRow.push(currentCell);
                if (currentRow.some(cell => String(cell).trim() !== '')) rows.push(currentRow);
            }

            return rows;
        }

        // Looks up a value by any of several header names, ignoring case/punctuation.
        function getVerbValue(verbObj, candidates) {
            const normalized = {};
            Object.keys(verbObj).forEach(key => {
                normalized[normalizeHeader(key)] = verbObj[key];
            });

            for (const candidate of candidates) {
                const value = normalized[normalizeHeader(candidate)];
                if (value !== undefined && value !== '') return value;
            }
            return '';
        }

        // Converts a Google Sheets "/edit" link into a CSV export link. Published CSV links pass through.
        function toCsvUrl(url) {
            const match = url.match(/^(https:\/\/docs\.google\.com\/spreadsheets\/d\/[^/?#]+)\/edit(?:[^#]*)?(?:#.*gid=(\d+))?/);
            if (match) {
                return `${match[1]}/export?format=csv${match[2] ? '&gid=' + match[2] : ''}`;
            }
            return url;
        }

        async function onSheetSelectChange() {
            const sheetSelect = document.getElementById('sheetSelect');
            const sheetUrlInput = document.getElementById('sheetUrl');
            const sheetUrlGroup = document.getElementById('sheetUrlGroup');
            document.getElementById('classVerbCount').textContent = '';
            document.getElementById('errorMessage').style.display = 'none';

            if (sheetSelect.value === 'custom') {
                sheetUrlInput.value = '';
                sheetUrlInput.disabled = false;
                sheetUrlGroup.style.display = '';
                sheetUrlInput.focus();
                return;
            }

            sheetUrlInput.value = sheetSelect.value || DEFAULT_SHEET_URL;
            sheetUrlInput.disabled = true;
            sheetUrlGroup.style.display = 'none';

            await loadVerbs();
        }

        function updateSelectedClassLabel(verbCount) {
            if (document.getElementById('sheetSelect').value === 'custom') return;
            document.getElementById('classVerbCount').textContent =
                `(${verbCount} verb${verbCount === 1 ? '' : 's'})`;
        }

        /* ---------- Conjugation ---------- */

        function normalizeVerbPhrase(rawValue) {
            return String(rawValue || '')
                .trim()
                .replace(/^to\s+/i, '')
                .replace(/\s+/g, ' ');
        }

        // Splits "get up" into head "get" and rest "up" so endings go on the verb itself.
        function splitVerbPhrase(rawValue) {
            const parts = normalizeVerbPhrase(rawValue).split(' ').filter(Boolean);
            return { head: parts.shift() || '', rest: parts.join(' ') };
        }

        function applyWordEndingToPhrase(phrase, transformWord) {
            const { head, rest } = splitVerbPhrase(phrase);
            if (!head) return '';
            return [transformWord(head), rest].filter(Boolean).join(' ');
        }

        function thirdPersonForm(word) {
            const lower = word.toLowerCase();
            if (/[sxz]$/.test(lower) || /(sh|ch)$/.test(lower)) return word + 'es';
            if (/[^aeiou]y$/.test(lower)) return word.slice(0, -1) + 'ies';
            if (lower === 'go' || lower === 'do') return word + 'es';
            return word + 's';
        }

        // One-syllable consonant-vowel-consonant words double the last letter (stop -> stopped).
        // Longer words are ambiguous, so sheet-provided forms are preferred for those.
        function doublesFinalConsonant(word) {
            return /^[^aeiou]*[aeiou][^aeiouwxy]$/i.test(word);
        }

        function regularPastForm(word) {
            if (/e$/i.test(word)) return word + 'd';
            if (/[^aeiou]y$/i.test(word)) return word.slice(0, -1) + 'ied';
            if (doublesFinalConsonant(word)) return word + word.slice(-1) + 'ed';
            return word + 'ed';
        }

        function presentParticipleForm(word) {
            if (/ie$/i.test(word)) return word.slice(0, -2) + 'ying';
            if (/e$/i.test(word) && !/(ee|oe|ye)$/i.test(word)) return word.slice(0, -1) + 'ing';
            if (doublesFinalConsonant(word)) return word + word.slice(-1) + 'ing';
            return word + 'ing';
        }

        function beAux(pronoun, tense) {
            const third = THIRD_PERSON.includes(pronoun);
            if (tense === 'past') return (pronoun === 'I' || third) ? 'was' : 'were';
            if (pronoun === 'I') return 'am';
            return third ? 'is' : 'are';
        }

        function getBaseForm(verb) {
            return normalizeVerbPhrase(getVerbValue(verb, ['base', 'infinitive', 'present', 'verb']));
        }

        function conjugateVerb(verb, pronoun, tense) {
            const base = getBaseForm(verb);
            const isBe = base.toLowerCase() === 'be';
            const third = THIRD_PERSON.includes(pronoun);

            // Sheet forms may hold the full phrase ("heated up") or only the main verb ("heated").
            // Either way the particle ends up attached exactly once.
            const { rest } = splitVerbPhrase(base);
            const withRest = (form) => {
                if (!form || !rest) return form;
                return form.toLowerCase().endsWith(' ' + rest.toLowerCase()) ? form : form + ' ' + rest;
            };

            // Sheet forms win; otherwise rules apply to the main verb only and the particle is rejoined unchanged.
            const past = withRest(getVerbValue(verb, ['past', 'past simple', 'simple past', 'past tense']))
                || applyWordEndingToPhrase(base, regularPastForm);
            const pastParticiple = withRest(getVerbValue(verb, ['past participle', 'pp', 'participle', 'past part']))
                || (isBe ? 'been' : '')
                || past;
            const presentParticiple = withRest(getVerbValue(verb, ['present participle', 'ing', 'gerund', 'ing form']))
                || (isBe ? 'being' : applyWordEndingToPhrase(base, presentParticipleForm));
            const presentThird = withRest(getVerbValue(verb, ['present third', 'third person', 'third person singular', 'he she it', 'present 3rd']))
                || applyWordEndingToPhrase(base, thirdPersonForm);

            const have = third ? 'has' : 'have';

            switch (tense) {
                case 'present':
                    if (isBe) return beAux(pronoun, 'present');
                    return third ? presentThird : base;
                case 'past':
                    if (isBe) return beAux(pronoun, 'past');
                    return past;
                case 'future':
                    return 'will ' + base;
                case 'present_continuous':
                    return beAux(pronoun, 'present') + ' ' + presentParticiple;
                case 'past_continuous':
                    return beAux(pronoun, 'past') + ' ' + presentParticiple;
                case 'present_perfect':
                    return have + ' ' + pastParticiple;
                case 'past_perfect':
                    return 'had ' + pastParticiple;
                default:
                    return base;
            }
        }

        /* ---------- Loading ---------- */

        async function loadVerbs() {
            const url = document.getElementById('sheetUrl').value.trim();
            if (!url) {
                showError('Please enter a Google Sheets URL');
                return false;
            }

            const myToken = ++loadToken;

            try {
                document.getElementById('loadingMessage').style.display = 'block';
                document.getElementById('errorMessage').style.display = 'none';

                let response;
                try {
                    response = await fetch(toCsvUrl(url));
                } catch (networkError) {
                    // fetch() only rejects when the request never completes (offline, blocked, CORS, sandboxed preview).
                    throw new Error("Couldn't reach Google Sheets. Check your internet connection and that the sheet is published to the web as CSV. If you're viewing this in a preview window, it may block outside requests; try opening the page in a regular browser tab.");
                }
                if (!response.ok) {
                    throw new Error('Google Sheets returned an error (' + response.status + '). Check that the sheet is published to the web as CSV and the link is correct.');
                }

                const rows = parseCsvText(await response.text());
                if (rows.length < 2) {
                    throw new Error('The sheet needs a header row and at least one verb row.');
                }

                // A newer load started while this one was in flight; discard this result.
                if (myToken !== loadToken) return false;

                const headers = rows[0].map(header => String(header).trim());
                const loaded = [];

                for (let i = 1; i < rows.length; i++) {
                    const verbObj = {};
                    headers.forEach((header, index) => {
                        const cleanedValue = String(rows[i][index] || '').trim();
                        if (header && cleanedValue) verbObj[header] = cleanedValue;
                    });

                    const baseValue = normalizeVerbPhrase(
                        getVerbValue(verbObj, ['base', 'infinitive', 'present', 'verb', 'word', 'english verb'])
                    );
                    if (baseValue) {
                        verbObj.base = baseValue;
                        loaded.push(verbObj);
                    }
                }

                if (loaded.length === 0) {
                    throw new Error('No verbs found in the sheet. Check that it has a column named Base, Infinitive or Verb.');
                }

                verbs = loaded;
                loadedSheetUrl = url;
                updateSelectedClassLabel(verbs.length);
                document.getElementById('loadingMessage').style.display = 'none';
                return true;

            } catch (error) {
                if (myToken === loadToken) {
                    document.getElementById('loadingMessage').style.display = 'none';
                    showError(error.message);
                }
                return false;
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function escapeHtml(value) {
            return String(value === undefined || value === null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        /* ---------- Scores & results ---------- */

        function loadRecentScores() {
            try {
                const raw = localStorage.getItem(RECENT_SCORES_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                return [];
            }
        }

        function saveRecentScore(entry) {
            try {
                const recentScores = loadRecentScores();
                recentScores.unshift(entry);
                localStorage.setItem(RECENT_SCORES_KEY, JSON.stringify(recentScores.slice(0, 5)));
            } catch (error) {
                // Storage can be unavailable (private mode, blocked); the app still works.
            }
            renderRecentScores();
        }

        function renderRecentScores() {
            const container = document.getElementById('recentScores');
            if (!container) return;

            const recentScores = loadRecentScores();
            if (!recentScores.length) {
                container.innerHTML = '<div class="score-item"><strong>Recent scores</strong><br><small>No recent scores yet.</small></div>';
                return;
            }

            const html = recentScores.map((entry) => {
                const dateLabel = new Date(entry.timestamp).toLocaleDateString([], { month: 'short', day: 'numeric' });
                return `
                    <div class="score-item">
                        <strong>${escapeHtml(entry.score)} / ${escapeHtml(entry.total)}</strong>
                        <br>
                        <small>${escapeHtml(entry.tenseLabel)} • ${escapeHtml(dateLabel)}</small>
                    </div>
                `;
            }).join('');

            container.innerHTML = `<strong>Recent scores</strong>${html}`;
        }

        function renderResultsSummary() {
            const container = document.getElementById('resultsSummary');
            if (!container) return;

            const missedCount = missedQuestions.length;
            const accuracy = totalQuestions ? Math.round((score / totalQuestions) * 100) : 0;
            const reasonCounts = missedQuestions.reduce((counts, item) => {
                counts[item.reason] = (counts[item.reason] || 0) + 1;
                return counts;
            }, {});
            const reviewFocus = Object.entries(reasonCounts)
                .map(([reason, count]) => `${reason} (${count})`)
                .join(', ');

            const cards = [
                { label: 'Correct', value: `${score}/${totalQuestions}`, className: 'value' },
                { label: 'Accuracy', value: `${accuracy}%`, className: accuracy >= 70 ? 'value' : accuracy >= 40 ? 'value warning' : 'value danger' },
                { label: 'Missed', value: String(missedCount), className: missedCount === 0 ? 'value' : 'value warning' },
                { label: 'Review focus', value: missedCount === 0 ? 'Great job' : reviewFocus, className: missedCount === 0 ? 'value small' : 'value small danger' }
            ];

            container.innerHTML = cards.map((card) => `
                <div class="summary-card">
                    <span class="label">${escapeHtml(card.label)}</span>
                    <span class="${card.className}">${escapeHtml(card.value)}</span>
                </div>
            `).join('');
        }

        function renderMissedQuestions() {
            const container = document.getElementById('missedVerbsContainer');
            if (!container) return;

            if (!missedQuestions.length) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            const listHtml = missedQuestions.map((item) => {
                const infoUrl = `https://conjugator.reverso.net/conjugation-english-verb-${encodeURIComponent((item.verbBase || '').toLowerCase())}.html`;
                return `
                    <li class="missed-item">
                        <strong>${escapeHtml(item.pronoun)} ${escapeHtml(item.answer)}.</strong>
                        <div><small>You wrote: ${escapeHtml(item.given || '(blank)')} — ${escapeHtml(item.reason)}</small></div>
                        <div><small><a href="${infoUrl}" target="_blank" rel="noopener noreferrer">Review this verb</a></small></div>
                    </li>
                `;
            }).join('');

            container.innerHTML = `<strong>Missed verbs</strong><ul class="missed-list">${listHtml}</ul>`;
            container.style.display = 'block';
        }

        /* ---------- Quiz flow ---------- */

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Every verb appears once before any repeats, even if questions > verbs.
        function pickVerbSequence(count) {
            const sequence = [];
            while (sequence.length < count) {
                sequence.push(...shuffle(verbs.map((_, index) => index)));
            }
            return sequence.slice(0, count);
        }

        async function startQuiz() {
            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = true;
            try {
                const selectedSheetUrl = document.getElementById('sheetUrl').value.trim();
                if (verbs.length === 0 || loadedSheetUrl !== selectedSheetUrl) {
                    const loaded = await loadVerbs();
                    if (!loaded) return;
                }

                currentTense = document.getElementById('tenseSelect').value;

                const countInput = document.getElementById('questionCount');
                totalQuestions = Math.min(50, Math.max(1, parseInt(countInput.value, 10) || 10));
                countInput.value = totalQuestions;

                missedQuestions = [];
                currentQuiz = pickVerbSequence(totalQuestions).map((verbIndex) => {
                    const verb = verbs[verbIndex];
                    const pronoun = PRONOUNS[Math.floor(Math.random() * PRONOUNS.length)];
                    return { verb, pronoun, answer: conjugateVerb(verb, pronoun, currentTense) };
                });

                currentQuestionIndex = 0;
                score = 0;

                document.getElementById('appHeader').style.display = 'none';
                document.getElementById('mainMenu').style.display = 'none';
                document.getElementById('quizSection').style.display = 'block';
                document.getElementById('currentTense').textContent = 'Current Tense: ' + tenseNames[currentTense];
                document.getElementById('progressFill').style.width = '0%';

                showQuestion();
            } finally {
                startBtn.disabled = false;
            }
        }

        function showQuestion() {
            const question = currentQuiz[currentQuestionIndex];
            const verbBase = getBaseForm(question.verb);
            const input = document.getElementById('answerInput');

            answered = false;
            cancelAutoAdvance();
            document.getElementById('questionCounter').textContent = `Question ${currentQuestionIndex + 1} of ${totalQuestions}`;
            document.getElementById('question').innerHTML =
                `<span class="pronoun">${escapeHtml(question.pronoun)}</span> <span class="verb-base">(${escapeHtml(verbBase)})</span>`;

            input.disabled = false;
            input.value = '';
            input.focus();

            document.getElementById('feedback').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('submitBtn').disabled = true;

            document.getElementById('progressFill').style.width =
                Math.round((currentQuestionIndex / totalQuestions) * 100) + '%';
        }

        function normalizeSentence(sentence) {
            return sentence.trim().replace(/\s+/g, ' ');
        }

        function getExpectedFullSentence(question) {
            return `${question.pronoun} ${question.answer}.`;
        }

        function isFullSentenceAnswer(answer, expected) {
            return normalizeSentence(answer) === normalizeSentence(expected);
        }

        // Explains why an answer was wrong. Returns { reason, verbFormOk }.
        function diagnoseAnswer(answer, question, expected) {
            const given = normalizeSentence(answer);
            const givenCore = given.replace(/[.!?]+$/, '');
            const expectedCore = normalizeSentence(expected).replace(/[.!?]+$/, '');
            const subject = givenCore.split(' ')[0] || '';
            const reasons = [];

            const subjectOk = subject.toLowerCase() === question.pronoun.toLowerCase();
            const verbFormOk = givenCore.toLowerCase() === expectedCore.toLowerCase();

            if (!subjectOk) {
                reasons.push('Wrong subject');
            } else if (!verbFormOk) {
                reasons.push('Wrong verb form');
            } else if (givenCore !== expectedCore) {
                reasons.push('Mis-capitalization');
            }
            if (!given.endsWith('.')) {
                reasons.push('Missing punctuation');
            }

            return { reason: reasons.join(' and ') || 'Incorrect answer', verbFormOk };
        }

        function checkAnswer() {
            if (answered) return;

            const input = document.getElementById('answerInput');
            const rawAnswer = input.value;
            if (!rawAnswer.trim()) return;

            const question = currentQuiz[currentQuestionIndex];
            const expected = getExpectedFullSentence(question);
            const feedback = document.getElementById('feedback');

            answered = true;
            input.disabled = true;
            document.getElementById('submitBtn').disabled = true;

            if (isFullSentenceAnswer(rawAnswer, expected)) {
                score++;
                feedback.textContent = 'Correct!';
                feedback.className = 'feedback correct';
            } else {
                const { reason, verbFormOk } = diagnoseAnswer(rawAnswer, question, expected);
                feedback.textContent = verbFormOk
                    ? `Almost! ${reason}. Expected: "${expected}"`
                    : `Incorrect (${reason}). Expected: "${expected}"`;
                feedback.className = 'feedback incorrect';
                missedQuestions.push({
                    pronoun: question.pronoun,
                    answer: question.answer,
                    verbBase: getBaseForm(question.verb),
                    given: normalizeSentence(rawAnswer),
                    reason
                });
            }

            feedback.style.display = 'block';
            const nextBtn = document.getElementById('nextBtn');
            document.getElementById('nextLabel').textContent =
                currentQuestionIndex + 1 >= totalQuestions ? 'See Results' : 'Next Question';
            nextBtn.style.display = 'inline-block';
            nextBtn.focus();
            startAutoAdvance();
        }

        /* ---------- Auto-advance (timed bar on the Next button) ---------- */

        const AUTO_ADVANCE_MS = 5000;
        const autoAdvance = { active: false, running: false, elapsed: 0, last: 0, raf: 0 };

        function setAutoFill(progress) {
            const fill = document.getElementById('autoFill');
            if (fill) fill.style.transform = `scaleX(${progress})`;
        }

        function autoAdvanceTick(now) {
            if (!autoAdvance.running) return;
            autoAdvance.elapsed += now - autoAdvance.last;
            autoAdvance.last = now;

            const progress = Math.min(1, autoAdvance.elapsed / AUTO_ADVANCE_MS);
            setAutoFill(progress);

            if (progress >= 1) {
                nextQuestion();   // cancels the timer itself
                return;
            }
            autoAdvance.raf = requestAnimationFrame(autoAdvanceTick);
        }

        // Runs only while the quiz is waiting on Next, the quit dialog is closed, and the tab is visible.
        function resumeAutoAdvance() {
            if (!autoAdvance.active || autoAdvance.running) return;
            if (document.hidden) return;
            if (document.getElementById('quitWarningOverlay').style.display === 'flex') return;
            autoAdvance.running = true;
            autoAdvance.last = performance.now();
            autoAdvance.raf = requestAnimationFrame(autoAdvanceTick);
        }

        function pauseAutoAdvance() {
            autoAdvance.running = false;
            cancelAnimationFrame(autoAdvance.raf);
        }

        function startAutoAdvance() {
            cancelAutoAdvance();
            autoAdvance.active = true;
            resumeAutoAdvance();
        }

        function cancelAutoAdvance() {
            pauseAutoAdvance();
            autoAdvance.active = false;
            autoAdvance.elapsed = 0;
            setAutoFill(0);
        }

        function nextQuestion() {
            cancelAutoAdvance();
            currentQuestionIndex++;
            if (currentQuestionIndex >= totalQuestions) {
                finishQuiz();
                return;
            }
            showQuestion();
        }

        function finishQuiz() {
            document.getElementById('quizSection').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('resultsTense').textContent = tenseNames[currentTense];

            const accuracy = totalQuestions ? Math.round((score / totalQuestions) * 100) : 0;
            const finalScoreEl = document.getElementById('finalScore');
            finalScoreEl.textContent = `${score}/${totalQuestions}`;
            finalScoreEl.className = 'score';
            if (accuracy >= 80) finalScoreEl.classList.add('excellent');
            else if (accuracy >= 60) finalScoreEl.classList.add('good');
            else finalScoreEl.classList.add('needs-improvement');

            const message = document.getElementById('scoreMessage');
            if (accuracy >= 80) {
                message.textContent = 'Excellent work!';
            } else if (accuracy >= 60) {
                message.textContent = 'Nice job! Review the missed verbs below.';
            } else {
                message.textContent = 'Keep practicing — you can improve quickly.';
            }

            renderResultsSummary();
            renderMissedQuestions();

            saveRecentScore({
                score: score,
                total: totalQuestions,
                tenseLabel: tenseNames[currentTense],
                timestamp: new Date().toISOString()
            });
        }

        function backToMenu() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'block';
            document.getElementById('appHeader').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('loadingMessage').style.display = 'none';
            renderRecentScores();
        }

        function quitQuiz() {
            cancelAutoAdvance();
            currentQuiz = [];
            currentQuestionIndex = 0;
            score = 0;
            missedQuestions = [];
            answered = false;
            document.getElementById('quizSection').style.display = 'none';
            document.getElementById('quitWarningOverlay').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'block';
            document.getElementById('appHeader').style.display = 'block';
            renderRecentScores();
        }

        function hideQuitWarning() {
            document.getElementById('quitWarningOverlay').style.display = 'none';
            const input = document.getElementById('answerInput');
            if (!input.disabled) input.focus();
            resumeAutoAdvance();
        }

        function showQuitWarning() {
            pauseAutoAdvance();
            document.getElementById('quitWarningOverlay').style.display = 'flex';
            document.getElementById('continueBtn').focus();
        }

        /* ---------- Events ---------- */

        window.addEventListener('DOMContentLoaded', () => {
            renderRecentScores();

            const input = document.getElementById('answerInput');
            input.addEventListener('input', () => {
                document.getElementById('submitBtn').disabled = answered || !input.value.trim();
            });
            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    checkAnswer();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') hideQuitWarning();
            });

            // Don't count down while the tab is in the background.
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) pauseAutoAdvance();
                else resumeAutoAdvance();
            });

            // Subtle cursor feedback (fine pointers only, skipped for reduced motion).
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (window.matchMedia('(pointer: fine)').matches && !reduceMotion) {
                const glow = document.getElementById('cursorGlow');
                document.addEventListener('mousemove', (event) => {
                    glow.style.left = event.clientX + 'px';
                    glow.style.top = event.clientY + 'px';
                    document.body.classList.add('custom-cursor-active');
                });
                document.addEventListener('mouseleave', () => {
                    document.body.classList.remove('custom-cursor-active');
                });
                document.addEventListener('click', (event) => {
                    const ripple = document.createElement('div');
                    ripple.className = 'click-ripple';
                    ripple.style.left = event.clientX + 'px';
                    ripple.style.top = event.clientY + 'px';
                    document.body.appendChild(ripple);
                    ripple.addEventListener('animationend', () => ripple.remove());
                });
            }

            onSheetSelectChange();
        });
    </script>
</body>
</html>
